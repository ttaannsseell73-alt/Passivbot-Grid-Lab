name: WSL GRID V2 Control

on:
  push:
    branches: [main]
    paths:
      - control/command.json

permissions:
  contents: read

concurrency:
  group: gridv2-local-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: [self-hosted, linux, x64, gridv2]
    timeout-minutes: 20
    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Verify canonical host
        shell: bash
        run: |
          set -euo pipefail
          test -d /home/tansel/Passivbot-Binance-Test
          test -x /home/tansel/Passivbot-Binance-Test/venv/bin/python
          echo HOST-PASS

      - name: Install managed runtime tools
        shell: bash
        run: |
          set -euo pipefail
          PB=/home/tansel/Passivbot-Binance-Test
          install -m 755 runtime-tools/demo-universe.py "$PB/runtime-tools/demo-universe.py"
          install -m 755 runtime-tools/patch-ranking-concurrency.py "$PB/runtime-tools/patch-ranking-concurrency.py"
          install -m 755 runtime-tools/patch-orchestrator-concurrency.py "$PB/runtime-tools/patch-orchestrator-concurrency.py"
          install -m 755 runtime-tools/test02-direction-shadow.py "$PB/runtime-tools/test02-direction-shadow.py"
          echo TOOLS-PASS

      - name: Execute requested mode
        shell: bash
        run: |
          set -euo pipefail
          PB=/home/tansel/Passivbot-Binance-Test
          MODE="$(python3 -c 'import json; print(json.load(open("control/command.json"))["mode"])')"
          echo "MODE=$MODE"

          stop_bot() {
            pids="$(pgrep -f "/venv/bin/passivbot live" || true)"
            if [ -n "$pids" ]; then
              kill $pids || true
            fi
            lockpids="$(pgrep -f "flock -n runtime-tools/passivbot-demo.lock" || true)"
            if [ -n "$lockpids" ]; then
              kill $lockpids || true
            fi
          }

          case "$MODE" in
            diagnose)
              echo "=== PROCESS ==="
              pgrep -af passivbot || true
              echo "=== RECENT BOT LOG ==="
              tail -n 180 "$PB/runtime-tools/passivbot-demo.log" 2>/dev/null || true
              echo "=== ACCOUNT STATE ==="
              cd "$PB"
              ./venv/bin/python runtime-tools/demostate.py
              ;;
            preflight)
              cd "$PB"
              ./venv/bin/python runtime-tools/demo-universe.py --config configs/demo-hsl.json --report runtime-tools/demo-universe-report.json
              ;;
            status)
              cd "$PB"
              ./venv/bin/python runtime-tools/demostate.py
              echo "=== EQUITY ==="
              ./venv/bin/python runtime-tools/gridv2-monitor.py snapshot
              echo "=== PROCESS ==="
              pgrep -af passivbot || true
              echo "=== RECENT BOT LOG ==="
              tail -n 120 runtime-tools/passivbot-demo.log 2>/dev/null || true
              ;;
            evidence)
              cd "$PB"
              echo "=== ACCOUNT STATE ==="
              ./venv/bin/python runtime-tools/demostate.py
              echo "=== EQUITY ==="
              ./venv/bin/python runtime-tools/gridv2-monitor.py snapshot
              echo "=== SAFE LIVE CONFIG ==="
              ./venv/bin/python -c 'import json; c=json.load(open("configs/demo-hsl.json"))["live"]; keys=["max_ohlcv_fetches_per_minute","max_forager_candle_refresh_seconds","max_forager_candle_staleness_minutes","defer_broad_candle_warmup","enable_forager_ws_candles","warmup_concurrency","warmup_fetch_delay_ms","max_concurrent_api_requests","candle_lock_timeout_seconds","max_warmup_minutes"]; print({k:c.get(k) for k in keys})'
              echo "=== FORAGER / ENTRY EVIDENCE ==="
              grep -E "\[forager\]|forager\.selection|top_scores|selected_symbols|entry_|ideal orders|create order|order create|placed|submitted|shortlist|slots_open|startup-ready" runtime-tools/passivbot-demo.log 2>/dev/null | tail -n 220 || true
              echo "=== RECENT LOG TAIL ==="
              tail -n 220 runtime-tools/passivbot-demo.log 2>/dev/null || true
              ;;
            cache-health)
              python3 runtime-tools/cache-health.py --root "$PB/caches/ohlcv/binance" --json-out "$PB/runtime-tools/cache-health.json"
              ;;
            cache-shape)
              cd "$PB"
              echo "=== CACHE ROOTS ==="
              find caches -maxdepth 8 -type f -name 'index.json' 2>/dev/null | head -n 40 || true
              echo "=== CACHE COUNTS ==="
              printf "index_files="
              find caches -type f -name 'index.json' 2>/dev/null | wc -l
              printf "npz_files="
              find caches -type f -name '*.npz' 2>/dev/null | wc -l
              du -sh caches/ohlcv 2>/dev/null || true
              ;;
            cache-sample)
              cd "$PB"
              for sym in AKE BROCCOLI714 NIL; do
                for tf in 1m 1h; do
                  d="caches/ohlcv/binance/$tf/${sym}_USDT:USDT"
                  echo "=== $sym $tf DIR ==="
                  find "$d" -maxdepth 2 -type f -printf '%P %s bytes\n' 2>/dev/null | sort | head -n 30 || true
                  echo "=== $sym $tf INDEX ==="
                  cat "$d/index.json" 2>/dev/null | head -c 8000 || true
                  echo
                done
              done
              ;;
            cache-array-sample)
              cd "$PB"
              for sym in AKE BROCCOLI714 NIL; do
                for tf in 1m 1h; do
                  echo "=== $sym $tf ARRAY ==="
                  file="$(find "caches/ohlcv/binance/$tf/${sym}_USDT:USDT" -maxdepth 1 -type f -name '*.npy' 2>/dev/null | sort | tail -n 1 || true)"
                  if [ -z "$file" ]; then
                    echo NONE
                    continue
                  fi
                  ./venv/bin/python -c 'import numpy as np,sys; a=np.load(sys.argv[1],allow_pickle=False); print("file",sys.argv[1],"shape",a.shape,"dtype",a.dtype,"names",a.dtype.names); print("first",a[0] if len(a) else None); print("last",a[-1] if len(a) else None)' "$file"
                done
              done
              ;;
            test02-shadow)
              cd "$PB"
              echo "=== TEST02 PRE ACCOUNT STATE ==="
              ./venv/bin/python runtime-tools/gridv2-monitor.py snapshot
              ./venv/bin/python runtime-tools/test02-direction-shadow.py \
                --root caches/ohlcv/binance/1h \
                --threshold 0.18 \
                --min-history 48 \
                --step-hours 4 \
                --round-trip-cost-bps 4 \
                --audit "AKE,long,2026-09-24T12:36:13Z" \
                --audit "BROCCOLI714,short,2026-09-24T12:36:13Z" \
                --audit "NIL,long,2026-09-24T12:36:13Z" \
                --json-out runtime-tools/test02-direction-report.json
              echo "=== TEST02 POST ACCOUNT STATE ==="
              ./venv/bin/python runtime-tools/gridv2-monitor.py snapshot
              ;;
            patch-ranking-concurrency)
              cd "$PB"
              if pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "PATCH-REFUSED bot running"
                exit 1
              fi
              ./venv/bin/python runtime-tools/patch-ranking-concurrency.py --path src/passivbot.py
              ./venv/bin/python -m py_compile src/passivbot.py
              grep -q GRID_V2_BOUNDED_FORAGER_RANKING src/passivbot.py
              echo RANKING-PATCH-VERIFY-PASS
              ;;
            patch-orchestrator-concurrency)
              cd "$PB"
              if pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "PATCH-REFUSED bot running"
                exit 1
              fi
              ./venv/bin/python runtime-tools/patch-orchestrator-concurrency.py --path src/passivbot.py
              ./venv/bin/python -m py_compile src/passivbot.py
              grep -q GRID_V2_BOUNDED_ORCHESTRATOR_EMA src/passivbot.py
              grep -q GRID_V2_BOUNDED_FORAGER_RANKING src/passivbot.py
              echo ORCHESTRATOR-PATCH-VERIFY-PASS
              ;;
            deploy-orchestrator-test01)
              cd "$PB"
              echo "=== PRE-DEPLOY ACCOUNT GUARD ==="
              snapshot="$(./venv/bin/python runtime-tools/gridv2-monitor.py snapshot)"
              printf '%s\n' "$snapshot"
              if ! printf '%s\n' "$snapshot" | grep -Eq '^POSITIONS[[:space:]]+0[[:space:]]*$'; then
                echo "DEPLOY-REFUSED non-flat positions"
                exit 1
              fi
              if ! printf '%s\n' "$snapshot" | grep -Eq '^OPEN ORDERS[[:space:]]+0[[:space:]]*$'; then
                echo "DEPLOY-REFUSED open orders present"
                exit 1
              fi
              echo "DEPLOY-GUARD-PASS flat account"

              stop_bot
              sleep 3
              if pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "DEPLOY-REFUSED bot process still running"
                exit 1
              fi

              ./venv/bin/python runtime-tools/patch-orchestrator-concurrency.py --path src/passivbot.py
              ./venv/bin/python -m py_compile src/passivbot.py
              grep -q GRID_V2_BOUNDED_FORAGER_RANKING src/passivbot.py
              grep -q GRID_V2_BOUNDED_ORCHESTRATOR_EMA src/passivbot.py
              echo "DEPLOY-PATCH-VERIFY-PASS"

              ./venv/bin/python runtime-tools/demo-universe.py --config configs/demo-hsl.json --report runtime-tools/demo-universe-report.json
              : > runtime-tools/passivbot-demo.log
              env -u RUNNER_TRACKING_ID setsid -f runtime-tools/run-once.sh > runtime-tools/passivbot-demo.log 2>&1 </dev/null
              echo "START-LAUNCHED"
              sleep 75
              echo "=== STARTUP LOG ==="
              tail -n 180 runtime-tools/passivbot-demo.log || true
              if grep -q "failed reason=startup_error" runtime-tools/passivbot-demo.log; then
                echo "TEST01-STARTUP-FAIL"
                stop_bot
                exit 1
              fi
              if ! pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "TEST01-PROCESS-MISSING"
                exit 1
              fi
              echo "TEST01-STARTUP-PASS"
              echo "=== POST-DEPLOY ACCOUNT STATE ==="
              ./venv/bin/python runtime-tools/demostate.py
              echo "=== POST-DEPLOY MARKERS ==="
              grep -n -E 'GRID_V2_BOUNDED_(FORAGER_RANKING|ORCHESTRATOR_EMA)' src/passivbot.py | head -n 20
              echo "=== POST-DEPLOY LOCK / FORAGER EVIDENCE ==="
              grep -E 'orchestrator EMA bounded fan-out|fetch_lock_hold_timeout|\[forager\]|shortlist|selected_symbols|top_scores|startup-ready' runtime-tools/passivbot-demo.log 2>/dev/null | tail -n 240 || true
              ;;
            start-test01)
              cd "$PB"
              ./venv/bin/python runtime-tools/demo-universe.py --config configs/demo-hsl.json --report runtime-tools/demo-universe-report.json
              if pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "START-REFUSED bot already running"
                exit 1
              fi
              : > runtime-tools/passivbot-demo.log
              env -u RUNNER_TRACKING_ID setsid -f runtime-tools/run-once.sh > runtime-tools/passivbot-demo.log 2>&1 </dev/null
              echo "START-LAUNCHED"
              sleep 75
              echo "=== STARTUP LOG ==="
              tail -n 180 runtime-tools/passivbot-demo.log || true
              if grep -q "failed reason=startup_error" runtime-tools/passivbot-demo.log; then
                echo "TEST01-STARTUP-FAIL"
                stop_bot
                exit 1
              fi
              if ! pgrep -f "/venv/bin/passivbot live" >/dev/null; then
                echo "TEST01-PROCESS-MISSING"
                exit 1
              fi
              echo "TEST01-STARTUP-PASS"
              ;;
            stop)
              stop_bot
              echo STOP-PASS
              ;;
            *)
              echo "REFUSED unknown mode: $MODE"
              exit 2
              ;;
          esac
