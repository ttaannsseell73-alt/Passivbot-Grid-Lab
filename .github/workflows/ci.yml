name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python -m py_compile runtime-tools/demo-universe.py runtime-tools/patch-ranking-concurrency.py
      - name: Verify ranking patch against pinned Passivbot
        run: |
          curl -fsSL https://raw.githubusercontent.com/enarjord/passivbot/7af64f3e930f4cf0cbb5fb88f31e9ce9594b0eb9/src/passivbot.py -o /tmp/passivbot.py
          python runtime-tools/patch-ranking-concurrency.py --path /tmp/passivbot.py
          python -m py_compile /tmp/passivbot.py
          grep -q GRID_V2_BOUNDED_FORAGER_RANKING /tmp/passivbot.py
